services:
  db:
    image: postgres:16-alpine
    container_name: edukadence-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-edukadence_db}
      POSTGRES_USER: ${DB_USER:-edukadence_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-edukadence_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-edukadence_user} -d ${DB_NAME:-edukadence_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.backend
    container_name: edukadence-backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-edukadence-dev-key-change-in-prod}
      DJANGO_SETTINGS_MODULE: config.settings.development
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgresql://${DB_USER:-edukadence_user}:${DB_PASSWORD:-edukadence_password}@db:5432/${DB_NAME:-edukadence_db}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_dev_data &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
    container_name: edukadence-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
